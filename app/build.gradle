plugins {
    id 'com.android.application'
}

android {
    namespace 'com.beyondstand.deepseekexport'
    compileSdk 34

    defaultConfig {
        applicationId "com.beyondstand.deepseekexport"
        minSdk 29          // MediaStore.Downloads 无需权限的起点
        targetSdk 34
        versionCode 2
        versionName "0.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 零第三方依赖：只依赖 android.jar（编译期）
